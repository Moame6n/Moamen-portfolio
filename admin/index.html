<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم | نتائج الاختبارات</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<style>
  body{ padding:0; }
  .topbar{
    background:var(--surface); color:var(--text); padding:18px 0;
    border-bottom:2px solid var(--emerald);
  }
  .topbar .container{ display:flex; justify-content:space-between; align-items:center; }
  .topbar h1{ color:var(--text); font-size:22px; }
  .topbar .who{ font-size:13px; color:var(--text-soft); }
  .topbar button{ background:transparent; border:1px solid var(--gold); color:var(--gold); padding:8px 16px; font-size:13px; cursor:pointer; font-family:'Tajawal',sans-serif; }
  .topbar button:hover{ background:var(--gold); color:#241A05; }

  .wrap{ max-width:1100px; margin:0 auto; padding:30px 24px 60px; }

  .login-box{
    max-width:380px; margin:80px auto; background:var(--surface); border:1px solid var(--border-soft);
    box-shadow:0 2px 0 var(--border-soft); padding:36px 30px;
  }
  .login-box h2{ font-size:22px; margin-bottom:8px; text-align:center; }
  .login-box p{ font-size:13px; color:var(--muted); text-align:center; margin-bottom:24px; }
  .login-box label{ display:block; font-size:13px; font-weight:700; margin-bottom:6px; }
  .login-box input{ width:100%; padding:11px 12px; border:1px solid var(--border-soft); background:var(--surface); color:var(--text); font-family:'Tajawal',sans-serif; font-size:14px; margin-bottom:16px; }
  .login-box button{ width:100%; padding:13px; font-size:14.5px; }
  .login-err{ color:var(--red); font-size:12.5px; text-align:center; margin-top:10px; display:none; }

  .stats-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:28px; }
  @media (max-width:760px){ .stats-row{ grid-template-columns:repeat(2,1fr); } }
  .stat-card{ background:var(--surface); border:1px solid var(--border-soft); padding:18px; text-align:center; }
  .stat-card .num{ font-size:26px; font-weight:900; color:var(--emerald); }
  .stat-card .lbl{ font-size:12px; color:var(--muted); margin-top:4px; }

  .toolbar{ display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; align-items:center; justify-content:space-between; }
  .toolbar select, .toolbar input{
    padding:10px 12px; border:1px solid var(--border-soft); background:var(--surface); color:var(--text);
    font-family:'Tajawal',sans-serif; font-size:13.5px;
  }
  table{ width:100%; border-collapse:collapse; background:var(--surface); border:1px solid var(--border-soft); }
  thead th{ background:var(--emerald); color:var(--bg); font-size:12.5px; padding:12px 10px; text-align:right; }
  tbody td{ padding:11px 10px; font-size:13.5px; border-bottom:1px solid var(--border-soft); }
  tbody tr:hover{ background:var(--surface-2); }
  .grade-pill{ padding:3px 10px; font-size:11.5px; font-weight:700; display:inline-block; }
  .grade-pill.high{ background:rgba(61,220,151,0.1); color:var(--emerald); }
  .grade-pill.mid{ background:rgba(224,177,92,0.12); color:var(--gold); }
  .grade-pill.low{ background:rgba(240,97,109,0.1); color:var(--red); }
  .empty-state{ text-align:center; padding:60px 20px; color:var(--muted); }
</style>
</head>
<body>

<div id="loginView" class="login-box">
  <h2>لوحة التحكم</h2>
  <p>ادخل كلمة المرور عشان تشوف نتائج المتقدمين لأي اختبار</p>
  <label>كلمة المرور</label>
  <input type="password" id="loginPass" placeholder="••••••••">
  <button class="btn btn-primary" id="loginBtn" type="button">دخول</button>
  <div class="login-err" id="loginErr"></div>
</div>

<div id="dashView" style="display:none;">
  <div class="topbar">
    <div class="container">
      <h1>لوحة نتائج الاختبارات</h1>
      <div style="display:flex; align-items:center; gap:14px;">
        <button id="logoutBtn" type="button">تسجيل الخروج</button>
      </div>
    </div>
  </div>
  <div class="wrap">
    <div class="stats-row">
      <div class="stat-card"><div class="num" id="statCount">0</div><div class="lbl">عدد المتقدمين</div></div>
      <div class="stat-card"><div class="num" id="statAvg">0%</div><div class="lbl">متوسط النسبة</div></div>
      <div class="stat-card"><div class="num" id="statTop">0%</div><div class="lbl">أعلى نتيجة</div></div>
      <div class="stat-card"><div class="num" id="statPass">0</div><div class="lbl">نسبة النجاح (≥65%)</div></div>
    </div>

    <div class="toolbar">
      <select id="examSelect"></select>
      <input type="text" id="searchBox" placeholder="بحث بالاسم...">
    </div>

    <div id="tableWrap">
      <table>
        <thead>
          <tr>
            <th>الاسم</th><th>الهاتف</th><th>النسبة</th><th>صح</th><th>خطأ</th><th>التصنيف</th><th>تاريخ الإنهاء</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div class="empty-state" id="emptyState" style="display:none;">لا توجد نتائج مسجلة بعد لهذا الاختبار</div>
    </div>
  </div>
</div>

<script src="/assets/supabase-config.js"></script>
<script>
let allExams = [];
let currentAttempts = [];

window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('loginBtn').addEventListener('click', doLogin);
  document.getElementById('logoutBtn').addEventListener('click', doLogout);
  document.getElementById('examSelect').addEventListener('change', loadAttempts);
  document.getElementById('searchBox').addEventListener('input', renderTable);
  document.getElementById('loginPass').addEventListener('keydown', (e) => { if(e.key === 'Enter') doLogin(); });

  const saved = sessionStorage.getItem('admin_passphrase');
  if(saved){
    passphrase = saved;
    showDashboard();
  }
});

let passphrase = null;

async function doLogin(){
  const pass = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginErr');
  errEl.style.display = 'none';
  if(!pass){
    errEl.textContent = 'اكتب كلمة المرور';
    errEl.style.display = 'block';
    return;
  }
  passphrase = pass;
  // verify by trying to load the exams list with it
  const ok = await loadExamsList();
  if(ok){
    sessionStorage.setItem('admin_passphrase', passphrase);
    showDashboard();
  } else {
    errEl.textContent = 'كلمة المرور غير صحيحة';
    errEl.style.display = 'block';
    passphrase = null;
  }
}
function doLogout(){
  sessionStorage.removeItem('admin_passphrase');
  passphrase = null;
  document.getElementById('dashView').style.display = 'none';
  document.getElementById('loginView').style.display = 'block';
}

async function showDashboard(){
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('dashView').style.display = 'block';
  if(allExams.length) loadAttempts();
}

async function callRpc(tableName){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_exam_results`, {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'apikey': SUPABASE_ANON_KEY
    },
    body: JSON.stringify({ p_table_name: tableName, p_passphrase: passphrase })
  });
  if(!res.ok) return null;
  return res.json();
}

async function loadExamsList(){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/exams?select=*&order=created_at.asc`, {
    headers:{ 'apikey': SUPABASE_ANON_KEY }
  });
  if(!res.ok){ return false; }
  allExams = await res.json();
  const sel = document.getElementById('examSelect');
  sel.innerHTML = allExams.map(e => `<option value="${e.table_name}">${e.title}</option>`).join('');
  if(!allExams.length) return true;
  // verify passphrase against the first exam table
  const data = await callRpc(allExams[0].table_name);
  return data !== null;
}

async function loadAttempts(){
  const tableName = document.getElementById('examSelect').value;
  if(!tableName) return;
  const data = await callRpc(tableName);
  if(data === null){
    currentAttempts = [];
    renderTable();
    return;
  }
  currentAttempts = data;
  renderStats();
  renderTable();
}

function renderStats(){
  const n = currentAttempts.length;
  document.getElementById('statCount').textContent = n;
  if(n === 0){
    document.getElementById('statAvg').textContent = '0%';
    document.getElementById('statTop').textContent = '0%';
    document.getElementById('statPass').textContent = '0%';
    return;
  }
  const avg = Math.round(currentAttempts.reduce((s,a)=>s+Number(a.percentage),0)/n);
  const top = Math.max(...currentAttempts.map(a=>Number(a.percentage)));
  const passCount = currentAttempts.filter(a=>Number(a.percentage)>=65).length;
  document.getElementById('statAvg').textContent = avg + '%';
  document.getElementById('statTop').textContent = top + '%';
  document.getElementById('statPass').textContent = Math.round((passCount/n)*100) + '%';
}

function gradeClass(pct){
  if(pct >= 85) return 'high';
  if(pct >= 65) return 'mid';
  return 'low';
}

function renderTable(){
  const search = (document.getElementById('searchBox').value || '').trim().toLowerCase();
  const rows = currentAttempts.filter(a => !search || (a.full_name||'').toLowerCase().includes(search));
  const body = document.getElementById('tableBody');
  const empty = document.getElementById('emptyState');
  if(rows.length === 0){
    body.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  body.innerHTML = rows.map(a => `
    <tr>
      <td>${escapeHtml(a.full_name || '—')}</td>
      <td>${escapeHtml(a.phone || '—')}</td>
      <td><b>${a.percentage}%</b></td>
      <td>${a.correct_count}</td>
      <td>${a.wrong_count}</td>
      <td><span class="grade-pill ${gradeClass(Number(a.percentage))}">${escapeHtml(a.grade_label || '')}</span></td>
      <td>${new Date(a.finished_at).toLocaleString('ar-EG')}</td>
    </tr>
  `).join('');
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
</script>
</body>
</html>
